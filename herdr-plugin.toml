id = "soraliu.agent-notifier"
name = "Agent Notifier"
version = "0.6.1"
min_herdr_version = "0.9.0"
description = "Agent list with two tabs: recently visited agent panes (jump back to any of them) plus done/blocked notifications; option+o toggles the floating popup"
platforms = ["linux", "macos"]

[[events]]
on = "pane.agent_status_changed"
command = ["node", "hooks/on-agent-status.js"]

[[events]]
on = "pane.agent_detected"
command = ["node", "hooks/on-agent-status.js"]

[[events]]
on = "pane.focused"
command = ["node", "hooks/on-agent-status.js"]

[[events]]
on = "pane.exited"
command = ["node", "hooks/on-agent-status.js"]

[[actions]]
id = "toggle"
title = "Toggle agent notification list"
contexts = ["global"]
command = ["node", "hooks/toggle.js"]

[[panes]]
id = "strip"
title = "agents"
placement = "popup"
width = "60%"
height = 50
command = ["node", "panes/strip.js"]
