id = "soraliu.agent-notifier"
name = "Agent Notifier"
version = "0.5.1"
min_herdr_version = "0.9.0"
description = "Persistent agent done/blocked list; option+o toggles a floating list, Enter jumps to the pane"
platforms = ["linux", "macos"]

[[events]]
on = "pane.agent_status_changed"
command = ["node", "hooks/on-agent-status.js"]


[[events]]
on = "pane.exited"
command = ["node", "hooks/on-agent-status.js"]

[[actions]]
id = "toggle"
title = "Toggle agent notification list"
contexts = ["global"]
command = ["node", "hooks/toggle.js"]

[[panes]]
id = "strip"
title = "agents"
placement = "popup"
width = "60%"
height = 16
command = ["node", "panes/strip.js"]
